# Catálogo de proyectos (de "Proyectos Entregar - Hoja 1"), SIN repetidos.
# Cada zona se descarga UNA sola vez aunque la usen varios proyectos; el Excel de
# cada proyecto replica la información de sus zonas.
#
#   python -m inmoscraper proyectos --plan                 # qué se va a descargar (no descarga)
#   python -m inmoscraper proyectos --pais PA --pais RD    # solo Panamá y Rep. Dominicana
#   python -m inmoscraper proyectos                        # todo, por prioridad
#   python -m inmoscraper proyectos --fichas               # + ficha de detalle de cada anuncio
#   python -m inmoscraper proyectos --solo-excel           # regenera Excel con lo ya descargado
#
# Fuentes por portal:
#   icasas (MX):  portal: icasas, estado, municipio, operaciones: [venta, renta], tipos: [...]
#   icasas (PA):  portal: icasas, lugar: arraijan|panama-oeste|panama|chorrera|chame|capira|..., tipos: [...]
#   cualquier otro: portal: mercadolibre|booking|supercasas|..., url: <link copiado del navegador>
#   verificar: true -> la URL no se pudo comprobar contra el sitio real; revisa que traiga anuncios
#                      (se marca en amarillo en el Excel si vienen 0).

ajustes:
  modo: auto
  pausa: [2, 4]
  max_paginas: 200
  datos: datos            # descargas intermedias (CSV por fuente, caché de fichas)
  salida: resultados      # aquí quedan los Excel: resultados/proyectos/
  navegador:
    headless: false
    canal: chrome
    espera_desafio: 90

zonas:

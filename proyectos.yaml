      - {portal: icasas, lugar: arraijan, operaciones: [venta], tipos: [apartamentos, casas, lotes-terrenos, residenciales]}
      - {portal: icasas, lugar: arraijan, operaciones: [alquiler], tipos: [apartamentos, casas]}
      - {portal: mercadolibre, etiqueta: ML apartamentos venta Costa Pacífica, operacion: venta, tipo: apartamentos, verificar: true, url: "https://inmuebles.mercadolibre.com.pa/apartamentos/venta/costa-pacifica"}
      - {portal: mercadolibre, etiqueta: ML casas venta Costa Pacífica, operacion: venta, tipo: casas, verificar: true, url: "https://inmuebles.mercadolibre.com.pa/casas/venta/costa-pacifica"}
      - {portal: mercadolibre, etiqueta: ML apartamentos venta Arraiján, operacion: venta, tipo: apartamentos, verificar: true, url: "https://inmuebles.mercadolibre.com.pa/apartamentos/venta/panama-oeste/arraijan/"}
      - {portal: mercadolibre, etiqueta: ML casas venta Arraiján, operacion: venta, tipo: casas, verificar: true, url: "https://inmuebles.mercadolibre.com.pa/casas/venta/panama-oeste/arraijan/"}
      - {portal: mercadolibre, etiqueta: ML terrenos venta Arraiján, operacion: venta, tipo: terrenos, verificar: true, url: "https://inmuebles.mercadolibre.com.pa/terrenos/venta/panama-oeste/arraijan/"}

